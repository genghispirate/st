plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fetch.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fetch.mobile'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
